name: "Publish and Maintain"

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: "Publish to npm"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run pack:check

      - name: Check npm version
        id: npm-version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view "create-atomic-install@$PACKAGE_VERSION" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "create-atomic-install@$PACKAGE_VERSION is already published"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "create-atomic-install@$PACKAGE_VERSION is not published yet"
          fi

      - name: Check npm auth
        if: steps.npm-version.outputs.published == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error title=Missing NPM_TOKEN::Add an npm automation token as the NPM_TOKEN repository secret."
            exit 1
          fi

          if ! NPM_USER=$(npm whoami); then
            echo "::error title=Invalid NPM_TOKEN::The NPM_TOKEN repository secret is invalid, expired, or not accepted by npm."
            exit 1
          fi

          echo "Authenticated to npm as $NPM_USER"

      - name: Publish
        if: steps.npm-version.outputs.published == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +e
          OUTPUT=$(npm publish --access public 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"

          if [ "$STATUS" -ne 0 ] && echo "$OUTPUT" | grep -q "EOTP"; then
            echo "::error title=NPM_TOKEN requires OTP::Replace NPM_TOKEN with a granular access token that has read/write package permission and bypass 2FA enabled for publishing."
          fi

          exit "$STATUS"
